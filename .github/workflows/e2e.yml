name: E2E

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'apps/web-app/**'
      - 'libs/**'
      - 'scripts/e2e/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'apps/web-app/**'
      - 'libs/**'
      - 'scripts/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '22.x'
  NODE_ENV: 'development'
  VITEST_POOL: 'forks'
  PORT: '3001'
  DB_HOST: '127.0.0.1'
  DB_PORT: '3306'
  DB_NAME: 'my_many_books_e2e'
  DB_USER: 'e2e'
  DB_PASSWORD: 'e2e'
  DB_SSL: 'false'
  FRONTEND_URL: 'http://localhost:3000'
  API_PREFIX: '/api'
  API_ROUTE_VERSION: 'v1'
  E2E_ADMIN_EMAIL: 'admin@example.com'
  E2E_ADMIN_NAME: 'Admin'
  E2E_ADMIN_SURNAME: 'User'
  E2E_USER_EMAIL: 'reader@example.com'
  E2E_USER_NAME: 'Reader'
  E2E_USER_SURNAME: 'User'
  E2E_SECRET_TOKEN: 'github-actions-e2e-secret-12345'
  CYPRESS_VIDEO: 'true'

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: my_many_books_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: |
          echo "Building hookey library..."
          npx nx build hookey
          echo "Building shared-auth library..."
          cd libs/shared-auth && npm run build && cd ../..
          echo "Building shared-i18n library..."
          cd libs/shared-i18n && npm run build && cd ../..
          echo "Building shared-logging library..."
          cd libs/shared-logging && npm run build && cd ../..
          echo "Building shared-validation library..."
          cd libs/shared-validation && npm run build && cd ../..
          echo "Building shared-types library..."
          cd libs/shared-types && npm run build && cd ../..

      - name: Rebuild SQLite3
        run: npm rebuild sqlite3 --silent

      - name: Run database migrations
        working-directory: apps/api
        run: npm run db:migrate

      - name: Seed database for E2E tests
        working-directory: apps/api
        run: npm run e2e:seed

      - name: Run Cypress E2E tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: npm run test:e2e

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            apps/web-app/cypress/videos
            apps/web-app/cypress/screenshots
