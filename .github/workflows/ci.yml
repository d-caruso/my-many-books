name: CI

on:
  push:
    branches: [ main, develop, feature/architecture-improvements, feature/mobile-hookey-integration ]
  pull_request:
    branches: [ main, develop, feature/architecture-improvements, feature/mobile-hookey-integration ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '22.x'

jobs:
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build hookey library
        run: npx nx build hookey

      - name: Build shared-auth library
        working-directory: libs/shared-auth
        run: npm run build

      - name: Debug - Verify shared-auth dist
        run: |
          echo "=== Checking shared-auth dist folder ==="
          ls -la libs/shared-auth/dist/ || echo "dist folder does not exist"

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    env:
      VITEST_POOL: forks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build hookey library
        run: npx nx build hookey

      - name: Build shared-auth library
        working-directory: libs/shared-auth
        run: npm run build

      - name: Build shared-validation library
        working-directory: libs/shared-validation
        run: npm run build

      - name: Debug - Verify shared-auth dist
        run: |
          echo "=== Checking shared-auth dist folder ==="
          ls -la libs/shared-auth/dist/ || echo "dist folder does not exist"

      - name: Rebuild SQLite3
        run: npm rebuild sqlite3 --silent

      - name: Test API
        working-directory: apps/api
        run: npm run test -- --forceExit

      - name: Test Web App - Accessibility
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:accessibility

      - name: Test Web App - Components (Auth)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:auth

      - name: Test Web App - Components (Book)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:book

      - name: Test Web App - Components (Error Boundary)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:error-boundary

      - name: Test Web App - Components (Layout)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:layout

      - name: Test Web App - Components (Navigation)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:navigation

      - name: Test Web App - Components (PWA)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:pwa

      - name: Test Web App - Components (Scanner)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:scanner

      - name: Test Web App - Components (Search - Form)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:search:form

      - name: Test Web App - Components (Search - Page)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:search:page

      - name: Test Web App - Components (Search - Results)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:search:results

      - name: Test Web App - Components (Theme)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:theme

      - name: Test Web App - Components (UI)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:ui

      - name: Test Web App - Components (Hook Executions)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:hook-executions

      - name: Test Web App - Components (Hook Form)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:hook-form

      - name: Test Web App - Components (Hooks List)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:hooks-list

      - name: Test Web App - Components (Protected Route)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:components:protected-route

      - name: Test Web App - Pages (Admin Dashboard)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:admin-dashboard

      - name: Test Web App - Pages (Admin Layout)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:admin-layout

      - name: Test Web App - Pages (Admin Settings)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:admin-settings

      - name: Test Web App - Pages (Admin Book Management)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:admin-book-management

      - name: Test Web App - Pages (Admin Hooks)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:admin-hooks

      - name: Test Web App - Pages (Admin User Management)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:admin-user-management

      - name: Test Web App - Pages (Auth)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:auth

      - name: Test Web App - Pages (Books)
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:pages:books

      - name: Test Web App - Services
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:services

      - name: Test Web App - Integration
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:integration

      - name: Test Web App - Hooks
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:hooks

      - name: Test Web App - Types
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:types

      - name: Test Web App - Utils
        working-directory: apps/web-app
        run: timeout 10m npm run test:web-app:utils

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build hookey library
        run: npx nx build hookey

      - name: Build shared-auth library
        working-directory: libs/shared-auth
        run: npm run build

      - name: Debug - Verify shared-auth dist
        run: |
          echo "=== Checking shared-auth dist folder ==="
          ls -la libs/shared-auth/dist/ || echo "dist folder does not exist"
          echo "=== Checking for index.d.ts ==="
          ls -la libs/shared-auth/dist/index.d.ts || echo "index.d.ts not found"

      - name: Build shared-i18n library
        working-directory: libs/shared-i18n
        run: npm run build

      - name: Debug - Verify shared-i18n dist
        run: |
          echo "=== Checking shared-i18n dist folder ==="
          ls -la libs/shared-i18n/dist/ || echo "dist folder does not exist"

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build Web App
        working-directory: apps/web-app
        run: npm run build
