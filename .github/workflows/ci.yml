name: CI

on:
  push:
    branches: [ main, develop, feature/authorization ]
  pull_request:
    branches: [ main, develop, feature/authorization ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '22.x'

jobs:
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared-auth library
        working-directory: libs/shared-auth
        run: npm run build

      - name: Debug - Verify shared-auth dist
        run: |
          echo "=== Checking shared-auth dist folder ==="
          ls -la libs/shared-auth/dist/ || echo "dist folder does not exist"

      - name: Build shared-i18n library
        working-directory: libs/shared-i18n
        run: npm run build

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared-auth library
        working-directory: libs/shared-auth
        run: npm run build

      - name: Debug - Verify shared-auth dist
        run: |
          echo "=== Checking shared-auth dist folder ==="
          ls -la libs/shared-auth/dist/ || echo "dist folder does not exist"

      - name: Build shared-i18n library
        working-directory: libs/shared-i18n
        run: npm run build

      - name: Rebuild SQLite3
        run: npm rebuild sqlite3 --silent

      - name: Test API
        working-directory: apps/api
        run: npm run test

      - name: Test Web App
        working-directory: apps/web-app
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared-auth library
        working-directory: libs/shared-auth
        run: npm run build

      - name: Debug - Verify shared-auth dist
        run: |
          echo "=== Checking shared-auth dist folder ==="
          ls -la libs/shared-auth/dist/ || echo "dist folder does not exist"
          echo "=== Checking for index.d.ts ==="
          ls -la libs/shared-auth/dist/index.d.ts || echo "index.d.ts not found"

      - name: Build shared-i18n library
        working-directory: libs/shared-i18n
        run: npm run build

      - name: Debug - Verify shared-i18n dist
        run: |
          echo "=== Checking shared-i18n dist folder ==="
          ls -la libs/shared-i18n/dist/ || echo "dist folder does not exist"

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build Web App
        working-directory: apps/web-app
        run: npm run build