# ================================================================
# serverless.yml - Serverless Framework Configuration
# ================================================================

service: my-many-books-api

frameworkVersion: '4.19.1'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-west-2'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30

  # Deployment bucket configuration
  deploymentBucket:
    name: my-many-books-serverless-deployments-${self:provider.region}-${self:provider.stage}
    serverSideEncryption: AES256

  # Environment variables
  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: ${cf:my-many-books-infrastructure-${self:provider.stage}.DatabaseEndpoint, ''}
    DB_PORT: ${cf:my-many-books-infrastructure-${self:provider.stage}.DatabasePort, '3306'}
    DB_NAME: my_many_books
    DB_USER: admin
    DB_PASSWORD: ${self:custom.dbCredentials.password}
    DB_SSL: 'true'
    DB_POOL_MAX: ${env:DB_POOL_MAX, '20'}
    DB_POOL_MIN: ${env:DB_POOL_MIN, '5'}
    API_VERSION: ${env:API_VERSION, '1.0.0'}
    API_PREFIX: ${env:API_PREFIX, '/api'}
    API_ROUTE_VERSION: ${env:API_ROUTE_VERSION, 'v1'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    
    # Security settings
    API_KEYS_ENABLED: ${env:API_KEYS_ENABLED, 'false'}
    COGNITO_ENABLED: ${env:COGNITO_ENABLED, 'true'}
    COGNITO_USER_POOL_ID: ${cf:my-many-books-cognito-${self:provider.stage}.CognitoUserPoolId}
    COGNITO_CLIENT_ID: ${cf:my-many-books-cognito-${self:provider.stage}.CognitoUserPoolClientId}
    SECURITY_HEADERS_ENABLED: ${env:SECURITY_HEADERS_ENABLED, 'true'}
    
    # External service settings
    OPEN_LIBRARY_BASE_URL: ${env:OPEN_LIBRARY_BASE_URL, 'https://openlibrary.org'}
    GOOGLE_BOOKS_API_KEY: ${env:GOOGLE_BOOKS_API_KEY, ''}
    GOOGLE_BOOKS_BASE_URL: ${env:GOOGLE_BOOKS_BASE_URL, 'https://www.googleapis.com/books/v1'}
    
    # Performance settings
    CACHE_TTL: ${env:CACHE_TTL, '3600'}
    REQUEST_TIMEOUT: ${env:REQUEST_TIMEOUT, '10000'}
    MAX_RETRIES: ${env:MAX_RETRIES, '3'}

  # API Gateway configuration
  apiGateway:
    description: My Many Books API - Personal library management system

  # IAM permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: 'arn:aws:logs:*:*:*'
        - Effect: Allow
          Action:
            - apigateway:GET
            - apigateway:POST
            - apigateway:PUT
            - apigateway:DELETE
          Resource: 'arn:aws:apigateway:*::/restapis/*'
        - Effect: Allow
          Action:
            - execute-api:Invoke
          Resource: 'arn:aws:execute-api:*:*:*'
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: 'arn:aws:secretsmanager:*:*:secret:my-many-books-infrastructure-*'

  # Tags for resource management  
  tags:
    Project: my-many-books
    Environment: ${self:provider.stage}
    Service: api
    CreatedBy: serverless

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node18
    external:
      - pg-native
      - pg-hstore
      - pg
      - sqlite3
      - mysql
      - mysql2
      - mariasql
      - mssql
      - oracle
      - oracledb
      - redis
      - sequelize
      - aws-sdk
      - react-native
      - react
      - react-dom

custom:
  # Fetch DB credentials from Secrets Manager
  dbCredentials: ${ssm:/aws/reference/secretsmanager/my-many-books-infrastructure-${self:provider.stage}-db-credentials}

  serverless-offline:
    httpPort: 3000
    port: 3000

functions:
  # Single function deployment using serverless-http
  api:
    handler: src/handlers/index.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Requested-With
            allowCredentials: true
      - http:
          path: /
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Requested-With
            allowCredentials: true

# CloudFormation Resources
# Cognito resources moved to standalone cognito-stack.yml
# See: apps/api/deployment/cloudformation/cognito-stack.yml
