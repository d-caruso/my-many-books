AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Cognito resources for My Many Books application'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  ServiceName:
    Type: String
    Default: my-many-books-api
    Description: Service name

  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 client ID used by Cognito social provider

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 client secret used by Cognito social provider

  ApiAuthCallbackUrl:
    Type: String
    Default: http://localhost:3001/api/v1/auth/google/callback
    Description: API callback URL used for Cognito authorization code redirect

  MobileAuthCallbackUrl:
    Type: String
    Default: my-many-books://auth
    Description: Mobile deep-link callback URL used for OAuth redirect

  WebAppUrl:
    Type: String
    Default: http://localhost:3000
    Description: Frontend web app URL used for Hosted UI logout redirect

Resources:
  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ServiceName}-user-pool-${Environment}'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Verify your My Many Books account"
        EmailMessage: "Your verification code is {####}"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      LambdaConfig:
        CustomMessage: !GetAtt CognitoCustomMessageLambda.Arn
        PostConfirmation: !GetAtt CognitoPostConfirmationLambda.Arn
      UserPoolTags:
        Project: my-many-books
        Environment: !Ref Environment
        Service: auth
        CreatedBy: cloudformation

  # IAM role for the Custom Message Lambda
  CognitoCustomMessageLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-custom-message-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: my-many-books
        - Key: Environment
          Value: !Ref Environment

  # Custom Message Lambda — sends bilingual auth emails (EN/IT)
  CognitoCustomMessageLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ServiceName}-custom-message-${Environment}'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt CognitoCustomMessageLambdaRole.Arn
      Timeout: 5
      Environment:
        Variables:
          WEB_APP_URL: !Ref WebAppUrl
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const locale = (event.request.userAttributes.locale || 'en').toLowerCase();
            const isItalian = locale.startsWith('it');
            const webAppUrl = (process.env.WEB_APP_URL || 'http://localhost:3000').replace(/\/+$/, '');

            const buildVerifyEmail = (verifyLink) => {
              if (isItalian) {
                return {
                  subject: 'Verifica il tuo account - My Many Books',
                  message:
                    '<p>Ciao,</p>' +
                    '<p>Grazie per esserti registrato su My Many Books!</p>' +
                    '<p>Il tuo codice di verifica è: <strong>{####}</strong></p>' +
                    '<p>Oppure <a href="' + verifyLink + '">clicca qui per verificare il tuo account</a>.</p>' +
                    '<p>Il codice scade tra 24 ore.</p>' +
                    '<p>Se non hai creato questo account, ignora questa email.</p>' +
                    '<p>Il team My Many Books</p>',
                };
              }
              return {
                subject: 'Verify your account - My Many Books',
                message:
                  '<p>Hello,</p>' +
                  '<p>Thank you for signing up for My Many Books!</p>' +
                  '<p>Your verification code is: <strong>{####}</strong></p>' +
                  '<p>Or <a href="' + verifyLink + '">click here to verify your account</a>.</p>' +
                  '<p>This code expires in 24 hours.</p>' +
                  '<p>If you did not create this account, please ignore this email.</p>' +
                  '<p>The My Many Books Team</p>',
              };
            };

            if (event.triggerSource === 'CustomMessage_SignUp' || event.triggerSource === 'CustomMessage_ResendCode') {
              const email = encodeURIComponent(event.request.userAttributes.email);
              const verifyLink = webAppUrl + '/auth/verify?email=' + email + '&code={####}';
              const { subject, message } = buildVerifyEmail(verifyLink);
              event.response.emailSubject = subject;
              event.response.emailMessage = message;
            }

            if (event.triggerSource === 'CustomMessage_ForgotPassword') {
              const email = encodeURIComponent(event.request.userAttributes.email);
              const resetLink = webAppUrl + '/auth/reset-password?email=' + email + '&code={####}';
              if (isItalian) {
                event.response.emailSubject = 'Reimposta la tua password - My Many Books';
                event.response.emailMessage =
                  '<p>Ciao,</p>' +
                  '<p>Hai richiesto di reimpostare la tua password per My Many Books.</p>' +
                  '<p>Il tuo codice di verifica è: <strong>{####}</strong></p>' +
                  '<p>Oppure <a href="' + resetLink + '">clicca qui per reimpostare la tua password</a>.</p>' +
                  '<p>Il codice scade tra 60 minuti.</p>' +
                  '<p>Se non hai richiesto questa operazione, ignora questa email.</p>' +
                  '<p>Il team My Many Books</p>';
              } else {
                event.response.emailSubject = 'Reset your password - My Many Books';
                event.response.emailMessage =
                  '<p>Hello,</p>' +
                  '<p>You requested to reset your password for My Many Books.</p>' +
                  '<p>Your verification code is: <strong>{####}</strong></p>' +
                  '<p>Or <a href="' + resetLink + '">click here to reset your password</a>.</p>' +
                  '<p>This code expires in 60 minutes.</p>' +
                  '<p>If you did not request a password reset, please ignore this email.</p>' +
                  '<p>The My Many Books Team</p>';
              }
            }

            return event;
          };
      Tags:
        - Key: Project
          Value: my-many-books
        - Key: Environment
          Value: !Ref Environment

  # Allow Cognito to invoke the Custom Message Lambda
  CognitoCustomMessageLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CognitoCustomMessageLambda.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  # IAM role for the Post Confirmation Lambda
  CognitoPostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-post-confirmation-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: my-many-books
        - Key: Environment
          Value: !Ref Environment

  # Post Confirmation Lambda — placeholder for post-reset notification
  # Fires on: PostConfirmation_ConfirmForgotPassword (password reset confirmed)
  #            PostConfirmation_ConfirmSignUp (email verification confirmed)
  # TODO: send "your password was reset" notification email when an email provider is configured.
  CognitoPostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ServiceName}-post-confirmation-${Environment}'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt CognitoPostConfirmationLambdaRole.Arn
      Timeout: 5
      Environment:
        Variables:
          WEB_APP_URL: !Ref WebAppUrl
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            if (event.triggerSource === 'PostConfirmation_ConfirmForgotPassword') {
              const email = event.request.userAttributes.email;
              const locale = (event.request.userAttributes.locale || 'en').toLowerCase();
              // TODO: send bilingual "your password was reset" notification email.
              // Use locale to select EN/IT template (same pattern as CustomMessage Lambda).
              // Requires an email provider (e.g. SES, Resend) to be configured.
              console.log('PostConfirmation_ConfirmForgotPassword', { email, locale });
            }
            return event;
          };
      Tags:
        - Key: Project
          Value: my-many-books
        - Key: Environment
          Value: !Ref Environment

  # Allow Cognito to invoke the Post Confirmation Lambda
  CognitoPostConfirmationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CognitoPostConfirmationLambda.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoGoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref CognitoUserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        given_name: given_name
        family_name: family_name
        username: sub

  # Cognito User Pool Client
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - CognitoGoogleIdentityProvider
    Properties:
      ClientName: !Sub '${ServiceName}-client-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs:
        - !Ref ApiAuthCallbackUrl
        - !Ref MobileAuthCallbackUrl
      LogoutURLs:
        - !Ref WebAppUrl
        - !Sub 'https://${ServiceName}-web-${Environment}.s3-website-${AWS::Region}.amazonaws.com'
      AccessTokenValidity: 24
      IdTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # Cognito User Pool Domain
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ServiceName}-auth-${Environment}'
      UserPoolId: !Ref CognitoUserPool

  # Cognito Identity Pool
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${ServiceName}-identity-pool-${Environment}'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName
          ServerSideTokenCheck: false

  # IAM Role for authenticated users
  CognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-authenticated-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: CognitoAuthenticatedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - mobileanalytics:PutEvents
                  - cognito-sync:*
                  - cognito-identity:*
                Resource: '*'
      Tags:
        - Key: Project
          Value: my-many-books
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: auth
        - Key: CreatedBy
          Value: cloudformation

  # Attach role to identity pool
  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthRole.Arn

# CloudFormation Outputs
Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${ServiceName}-${Environment}-CognitoUserPoolId'

  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${ServiceName}-${Environment}-CognitoUserPoolClientId'

  CognitoIdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref CognitoIdentityPool
    Export:
      Name: !Sub '${ServiceName}-${Environment}-CognitoIdentityPoolId'

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub '${ServiceName}-${Environment}-CognitoUserPoolArn'

  CognitoUserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Ref CognitoUserPoolDomain
    Export:
      Name: !Sub '${ServiceName}-${Environment}-CognitoUserPoolDomain'

  AwsRegion:
    Description: AWS Region
    Value: !Ref AWS::Region
    Export:
      Name: !Sub '${ServiceName}-${Environment}-AwsRegion'
