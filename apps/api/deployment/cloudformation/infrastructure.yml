AWSTemplateFormatVersion: '2010-09-09'
Description: 'My Many Books API - Core Infrastructure'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Environment name

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']

Resources:
  # S3 Bucket for Serverless Framework deployments
  ServerlessDeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'my-many-books-serverless-deployments-${AWS::Region}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldDeployments
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub 'my-many-books-serverless-deployments-${AWS::Region}-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: serverless-framework-deployments

  # CloudWatch Log Group
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !If [IsProduction, 30, 7]

Outputs:
  ApiLogGroupName:
    Description: CloudWatch Log Group Name
    Value: !Ref ApiLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup-Name'
